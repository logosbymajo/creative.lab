name: Publicar función de IA
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/funciones.yml"]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: qqwlgbcrdiyklvyjebbx
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Guardar las claves en Supabase
        run: supabase secrets set ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" APIFY_TOKEN="${{ secrets.APIFY_TOKEN }}" --project-ref $PROJECT
      - name: Publicar las funciones
        run: |
          supabase functions deploy ia --project-ref $PROJECT --no-verify-jwt
          supabase functions deploy video --project-ref $PROJECT --no-verify-jwt
