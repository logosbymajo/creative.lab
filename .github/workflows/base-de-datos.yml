name: Actualizar base de datos
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: {}
jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: qqwlgbcrdiyklvyjebbx
    steps:
      - uses: actions/checkout@v4
      - name: Correr los cambios de la base de datos
        run: |
          for f in supabase/migrations/*.sql; do
            body=$(jq -Rs '{query: .}' "$f")
            code=$(curl -s -o out.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
            if [ "$code" -ge 300 ]; then echo "::error::$f ($code): $(head -c 500 out.json)"; exit 1; fi
            echo "::notice::$f aplicado"
          done
